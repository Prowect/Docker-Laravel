name: Docker Image CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for tests and vulnerability scan
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          no-cache: true
          platforms: linux/amd64
          pull: true
          tags: docker-laravel:scan

      - name: Test AMD64 image
        run: ./tests/entrypoint.sh docker-laravel:scan

      - name: Build ARM64 image for tests
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/arm64
          pull: true
          tags: docker-laravel:scan-arm64

      - name: Test ARM64 image
        run: ./tests/entrypoint.sh docker-laravel:scan-arm64

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: docker-laravel:scan
          version: v0.72.0
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln
          severity: HIGH,CRITICAL

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate tags
        if: github.event_name != 'pull_request'
        run: |
          if [[ $GITHUB_REF == 'refs/tags/'* ]]; then
            echo "tags=prowect/laravel:${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV
          else
            echo "tags=prowect/laravel:latest" >> $GITHUB_ENV
          fi

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ env.tags }}
